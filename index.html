<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W Properties — Operations Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a1a;font-size:14px;}
.dash{padding:1.5rem;max-width:1400px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px;}
.topbar-title{font-size:22px;font-weight:600;color:#1a1a1a;}
.topbar-sub{font-size:13px;color:#666;margin-top:2px;}
.refresh-btn{font-size:12px;padding:6px 14px;cursor:pointer;border-radius:8px;border:1px solid #ddd;background:#fff;color:#555;}
.refresh-btn:hover{background:#f0f0ee;}
.main-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:2px solid #e5e5e0;}
.mnav{padding:8px 18px;font-size:14px;cursor:pointer;border:none;background:none;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;transition:color .15s;}
.mnav:hover{color:#1a1a1a;}
.mnav.active{color:#1D9E75;border-bottom-color:#1D9E75;}
.loc-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1px solid #e5e5e0;}
.ltab{padding:7px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.ltab:hover{color:#1a1a1a;}
.ltab.active{color:#1D9E75;border-bottom-color:#1D9E75;font-weight:600;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem;}
.mc{background:#fff;border-radius:10px;padding:16px;border:1px solid #eee;}
.mc-label{font-size:11px;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.mc-val{font-size:28px;font-weight:600;line-height:1;}
.mc-val.green{color:#0F6E56;}.mc-val.red{color:#A32D2D;}.mc-val.amber{color:#854F0B;}.mc-val.blue{color:#185FA5;}
.mc-sub{font-size:11px;color:#999;margin-top:5px;}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title{font-size:14px;font-weight:600;color:#1a1a1a;}
.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem;}
.stab{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#888;transition:all .15s;}
.stab:hover{background:#f5f5f3;}
.stab.active{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:600;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:#999;border-bottom:1px solid #eee;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;}
td{padding:9px 12px;border-bottom:1px solid #f0f0ee;color:#1a1a1a;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafaf8;}
.badge{display:inline-block;font-size:10px;padding:2px 9px;border-radius:10px;font-weight:600;white-space:nowrap;}
.b-green{background:#E1F5EE;color:#085041;}.b-red{background:#FCEBEB;color:#791F1F;}
.b-amber{background:#FAEEDA;color:#633806;}.b-blue{background:#E6F1FB;color:#0C447C;}
.b-purple{background:#EEEDFE;color:#3C3489;}.b-coral{background:#FAECE7;color:#712B13;}
.b-pink{background:#FBEAF0;color:#72243E;}.b-gray{background:#f0f0ee;color:#666;}
.alert-row td{background:#FFFBF0;}
.loading{padding:3rem;text-align:center;font-size:13px;color:#999;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #ddd;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media(max-width:700px){.two-col{grid-template-columns:1fr;}.dash{padding:1rem;}}
.empty{font-size:13px;color:#bbb;padding:14px 0;text-align:center;}
.loc-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.person-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.ptab{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#888;transition:all .15s;}
.ptab:hover{background:#f5f5f3;}
.ptab.active{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:600;}
.cnt-pill{background:rgba(255,255,255,0.3);border-radius:10px;padding:1px 6px;font-size:10px;margin-left:3px;}
.cnt-pill-inactive{background:#f0f0ee;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:3px;color:#888;}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #f0f0ee;}
.task-row:last-child{border-bottom:none;}
.task-check{width:18px;height:18px;border:1.5px solid #ccc;border-radius:4px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.task-check:hover{border-color:#1D9E75;}
.task-check.done{background:#1D9E75;border-color:#1D9E75;}
.task-check.done::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.task-check.inprog{background:#EF9F27;border-color:#EF9F27;}
.task-check.inprog::after{content:'';width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.8);display:block;}
.task-body{flex:1;min-width:0;}
.task-title{font-size:13px;color:#1a1a1a;line-height:1.4;}
.task-title.done{text-decoration:line-through;color:#bbb;}
.task-meta{font-size:11px;color:#999;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.task-del{font-size:20px;color:#ddd;cursor:pointer;border:none;background:none;padding:0 4px;line-height:1;flex-shrink:0;transition:color .15s;}
.task-del:hover{color:#A32D2D;}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.p-high{background:#E24B4A;}.p-medium{background:#EF9F27;}.p-low{background:#1D9E75;}
.add-task-form{margin-top:16px;padding-top:16px;border-top:1px solid #f0f0ee;display:flex;flex-wrap:wrap;gap:8px;}
.add-task-form input,.add-task-form select{font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;}
.add-task-form input:focus,.add-task-form select:focus{border-color:#1D9E75;}
.add-task-form input[type=text]{flex:1;min-width:180px;}
.add-task-form input[type=date]{flex:0 0 auto;}
.add-task-form select{flex:0 0 auto;}
.add-btn{padding:8px 18px;background:#1D9E75;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;flex-shrink:0;transition:background .15s;}
.add-btn:hover{background:#0F6E56;}
.add-btn:disabled{background:#ccc;cursor:not-allowed;}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}

.proj-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:1rem;cursor:pointer;transition:border-color .15s;}
.proj-card:hover{border-color:#1D9E75;}
.proj-card.active-proj{border:2px solid #1D9E75;}
.proj-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.proj-name{font-size:15px;font-weight:600;color:#1a1a1a;}
.proj-meta{font-size:12px;color:#999;margin-top:3px;}
.progress-bar{height:6px;background:#f0f0ee;border-radius:3px;margin:10px 0 4px;overflow:hidden;}
.progress-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .3s;}
.progress-label{font-size:11px;color:#999;}
.proj-actions{display:flex;gap:6px;flex-shrink:0;}
.proj-btn{padding:5px 12px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666;transition:all .15s;}
.proj-btn:hover{background:#f5f5f3;}
.proj-btn.danger{border-color:#f7c1c1;color:#A32D2D;}
.proj-btn.danger:hover{background:#FCEBEB;}
.proj-btn.primary{background:#1D9E75;color:#fff;border-color:#1D9E75;}
.proj-btn.primary:hover{background:#0F6E56;}
.new-proj-form{background:#f8f8f6;border-radius:10px;padding:1.25rem;margin-bottom:1rem;border:1px dashed #ddd;}
.new-proj-form input,.new-proj-form select,.new-proj-form textarea{font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;width:100%;margin-bottom:8px;outline:none;}
.new-proj-form input:focus,.new-proj-form select:focus,.new-proj-form textarea:focus{border-color:#1D9E75;}
.new-proj-form textarea{height:70px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}
.proj-detail{background:#f8f8f6;border-radius:10px;padding:1.25rem;margin-bottom:1rem;}
.proj-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back-btn{font-size:12px;color:#1D9E75;cursor:pointer;border:none;background:none;padding:0;}
.back-btn:hover{text-decoration:underline;}
.archive-bar{display:flex;align-items:center;justify-content:space-between;background:#f8f8f6;border-radius:8px;padding:10px 14px;margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.archive-bar span{font-size:13px;color:#888;}
.b-notstarted{background:#f0f0ee;color:#666;}
.b-inprogress{background:#E6F1FB;color:#0C447C;}
.b-onhold{background:#FAEEDA;color:#633806;}
.b-complete{background:#E1F5EE;color:#085041;}

.modal-overlay{position:absolute;top:0;left:0;width:100%;min-height:100%;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:820px;overflow:hidden;margin-top:1rem;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee;}
.modal-title{font-size:15px;font-weight:600;color:#1a1a1a;}
.modal-close{font-size:22px;cursor:pointer;border:none;background:none;color:#999;line-height:1;padding:0 4px;}
.modal-close:hover{color:#1a1a1a;}
.modal-body{padding:16px 20px;max-height:70vh;overflow-y:auto;}
.mc-link{cursor:pointer;transition:opacity .15s;}
.mc-link:hover{opacity:.8;}
.mc-link .mc-sub{color:#1D9E75;font-weight:500;}
#detail-modal{display:none;}
#detail-modal.open{display:flex;}

.contacts-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem;}
.contacts-toolbar input{font-size:13px;padding:7px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;flex:1;min-width:180px;}
.contacts-toolbar input:focus{border-color:#1D9E75;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.filter-pill{padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#888;transition:all .15s;font-weight:500;}
.filter-pill:hover{background:#f5f5f3;}
.filter-pill.active{background:#1D9E75;color:#fff;border-color:#1D9E75;}
.contact-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:14px;transition:border-color .15s;}
.contact-card:hover{border-color:#1D9E75;}
.contact-avatar{width:38px;height:38px;border-radius:50%;background:#1D9E75;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}
.contact-info{flex:1;min-width:0;}
.contact-name{font-size:13px;font-weight:600;color:#1a1a1a;}
.contact-email{font-size:12px;color:#888;margin-top:2px;}
.contact-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;}
.contact-score{font-size:11px;color:#999;margin-left:auto;white-space:nowrap;}
.contacts-count{font-size:12px;color:#999;margin-bottom:1rem;}
.list-badge{background:#E6F1FB;color:#0C447C;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.tag-badge{background:#EEEDFE;color:#3C3489;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.err-msg{padding:12px 16px;background:#FCEBEB;border-radius:8px;font-size:13px;color:#791F1F;margin-bottom:1rem;}

.vo-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1px solid #e5e5e0;}
.vtab{padding:7px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.vtab:hover{color:#1a1a1a;}
.vtab.active{color:#1D9E75;border-bottom-color:#1D9E75;font-weight:600;}
.vo-search{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;}
.vo-search input{font-size:13px;padding:7px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;flex:1;min-width:180px;}
.vo-search input:focus{border-color:#1D9E75;}
.vo-search select{font-size:13px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;}
.vo-table-wrap{overflow-x:auto;}
.vo-count{font-size:12px;color:#999;margin-bottom:1rem;}
.svc-badge-addr{background:#E6F1FB;color:#0C447C;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.svc-badge-pmb{background:#EEEDFE;color:#3C3489;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.svc-badge-mail{background:#FAEEDA;color:#633806;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.svc-badge-other{background:#f0f0ee;color:#666;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
</style>
</head>
<body>
<div class="dash" style="position:relative;">
  <div class="topbar">
    <div>
      <div class="topbar-title">W Properties — Operations Dashboard</div>
      <div class="topbar-sub" id="last-updated">Loading...</div>
    </div>
    <button class="refresh-btn" onclick="refreshAll()">&#8635; Refresh</button>
  </div>
  <div class="main-nav">
    <button class="mnav active" onclick="switchMain('properties')">Properties</button>
    <button class="mnav" onclick="switchMain('tasks')">Tasks</button>
    <button class="mnav" onclick="switchMain('projects')">Projects</button>
    <button class="mnav" onclick="switchMain('contacts')">Contacts</button>
    <button class="mnav" onclick="switchMain('vo')">Virtual Office</button>
  </div>
  <div id="properties-section">
    <div class="loc-tabs" id="loc-tabs"></div>
    <div id="dashboard-body"><div class="loading"><span class="spinner"></span>Loading property data...</div></div>
  </div>
  <div id="tasks-section" style="display:none;">
    <div id="tasks-body"><div class="loading"><span class="spinner"></span>Loading tasks...</div></div>
  </div>
  <div id="projects-section" style="display:none;">
    <div id="projects-body"><div class="loading"><span class="spinner"></span>Loading projects...</div></div>
  </div>
  <div id="contacts-section" style="display:none;">
    <div id="contacts-body"><div class="loading"><span class="spinner"></span>Loading contacts...</div></div>
  </div>
  <div id="vo-section" style="display:none;">
    <div id="vo-body"><div class="loading"><span class="spinner"></span>Loading virtual office data...</div></div>
  </div>
</div>
<div id="detail-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title">Details</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const TASKS_API='https://script.google.com/macros/s/AKfycbwb6d9fB0lyiHRCdnzIxt37QgA0-Wwme6KewPIkf1wFJlg2F4R_6-I5IIMwYezRbOdVVg/exec';
const LOCATIONS=[
  {name:'Magnolia Woods',url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4YmIGGk9tvdLQ_N0IQ8s-47WZLPWnaaldw2q3JnZ0W9KgET8zjPugSV9JGQH3sZPImcX6cKyQb8Y_/pub?gid=0&single=true&output=csv',manager:'Angela',color:'b-green',dot:'#1D9E75'},
  {name:'Walden',url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4YmIGGk9tvdLQ_N0IQ8s-47WZLPWnaaldw2q3JnZ0W9KgET8zjPugSV9JGQH3sZPImcX6cKyQb8Y_/pub?gid=1157477898&single=true&output=csv',manager:'Crystal',color:'b-blue',dot:'#378ADD'},
  {name:'Office Park',url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4YmIGGk9tvdLQ_N0IQ8s-47WZLPWnaaldw2q3JnZ0W9KgET8zjPugSV9JGQH3sZPImcX6cKyQb8Y_/pub?gid=1002033801&single=true&output=csv',manager:'Johnna',color:'b-purple',dot:'#7F77DD'},
  {name:'Blue Heron Bay',url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4YmIGGk9tvdLQ_N0IQ8s-47WZLPWnaaldw2q3JnZ0W9KgET8zjPugSV9JGQH3sZPImcX6cKyQb8Y_/pub?gid=1785197572&single=true&output=csv',manager:'Johnna',color:'b-coral',dot:'#D85A30'},
  {name:'South Lake Conroe',url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4YmIGGk9tvdLQ_N0IQ8s-47WZLPWnaaldw2q3JnZ0W9KgET8zjPugSV9JGQH3sZPImcX6cKyQb8Y_/pub?gid=1238510324&single=true&output=csv',manager:'Crystal',color:'b-pink',dot:'#D4537E'},
];
const TEAM=['General','James','Johnna','Crystal','Angela','Chris','Christine'];
let acContactsLoaded=false,allContacts=[],allContactTags=[],allContactLists=[],activeTagFilter='',activeListFilter='',contactSearch='';
let voData={Magnolia:[],Walden:[]},activeVOLocation='Magnolia',voSearch='',voServiceFilter='';
let allData={},activeLoc='All Locations',activePropSec='overview',activeMain='properties',activePerson='General',allTasks=[],allProjects=[],activeProjectId=null,showNewProjForm=false;
let showArchiveView=false,archivedItems=[],archiveLoaded=false,archiveTypeFilter='All',archiveAssigneeFilter='All';

function switchMain(s){
  activeMain=s;
  document.querySelectorAll('.mnav').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('properties-section').style.display=s==='properties'?'block':'none';
  document.getElementById('tasks-section').style.display=s==='tasks'?'block':'none';
  document.getElementById('projects-section').style.display=s==='projects'?'block':'none';
  document.getElementById('contacts-section').style.display=s==='contacts'?'block':'none';
  document.getElementById('vo-section').style.display=s==='vo'?'block':'none';
  if(s==='tasks')renderTasks();
  if(s==='projects')loadProjects();
  if(s==='contacts'&&!allContacts.length)loadContacts();
  else if(s==='contacts')renderContacts();
  if(s==='vo')loadVO();
}

function refreshAll(){loadPropertyData();if(activeMain==='tasks')loadTasks();if(activeMain==='projects')loadProjects();}

function parseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2)return[];
  const headers=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){inQ=!inQ;}else if(line[i]===','&&!inQ){vals.push(cur.trim());cur='';}else cur+=line[i];
    }
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>obj[h]=vals[i]||'');return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}

async function loadPropertyData(){
  document.getElementById('last-updated').textContent='Loading...';
  const RAILWAY_CSV_PROXY='https://magnolia-platform-backend1-production.up.railway.app/api/csv-proxy?url=';
  await Promise.all(LOCATIONS.map(async loc=>{
    try{
      const res=await fetch(RAILWAY_CSV_PROXY+encodeURIComponent(loc.url));
      if(!res.ok)throw new Error('proxy failed');
      allData[loc.name]=parseCSV(await res.text());
    }catch(e){
      try{const r2=await fetch(loc.url,{mode:'cors'});allData[loc.name]=parseCSV(await r2.text());}
      catch(e2){allData[loc.name]=null;}
    }
  }));
  document.getElementById('last-updated').textContent='Last updated: '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · '+new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  renderLocTabs();renderProperties();
}

function renderLocTabs(){

    const l=LOCATIONS.find(x=>x.name===t);
    return`<button class="ltab ${t===activeLoc?'active':''}" onclick="switchLoc('${t}')">${l?`<span class="loc-dot" style="background:${l.dot};"></span>`:''} ${t}</button>`;
  }).join('');
}

function switchLoc(n){activeLoc=n;activePropSec='overview';renderLocTabs();renderProperties();}
function switchPropSec(s){activePropSec=s;renderProperties();}

function getLocData(){
  if(activeLoc==='All Locations'){let c=[];LOCATIONS.forEach(l=>{if(allData[l.name])allData[l.name].forEach(r=>c.push({...r,_location:l.name}));});return c;}
  return(allData[activeLoc]||[]).map(r=>({...r,_location:activeLoc}));
}

function daysUntil(ds){if(!ds)return null;const d=new Date(ds);if(isNaN(d))return null;return Math.ceil((d-new Date())/86400000);}
function fmtDate(ds){if(!ds)return'—';const d=new Date(ds);if(isNaN(d))return ds;return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function toIsoDate(ds){if(!ds)return'';const d=new Date(ds);if(isNaN(d))return'';const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`;}
function statusBadge(s){if(!s)return'<span class="badge b-gray">—</span>';const sl=s.toLowerCase();if(sl==='rented')return'<span class="badge b-green">Rented</span>';if(sl==='vacant')return'<span class="badge b-red">Vacant</span>';if(sl.includes('notice'))return'<span class="badge b-amber">Notice given</span>';return'<span class="badge b-gray">'+s+'</span>';}
function expiryBadge(ds){const d=daysUntil(ds);if(d===null)return'<span class="badge b-gray">—</span>';if(d<0)return'<span class="badge b-red">Expired</span>';if(d<=30)return'<span class="badge b-red">'+d+'d</span>';if(d<=60)return'<span class="badge b-amber">'+d+'d</span>';return'<span class="badge b-green">'+d+'d</span>';}
function locBadge(n){const l=LOCATIONS.find(x=>x.name===n);return`<span class="badge ${l?l.color:'b-gray'}"><span class="loc-dot" style="background:${l?l.dot:'#999'};"></span>${n}</span>`;}

async function loadTasks(){
  document.getElementById('tasks-body').innerHTML='<div class="loading"><span class="spinner"></span>Loading tasks...</div>';
  try{
    const res=await fetch(TASKS_API+'?action=getTasks',{mode:'cors'});

    allTasks=data.tasks||[];
  }catch(e){allTasks=[];}
  renderTasks();
}

function renderTasks(){
  const body=document.getElementById('tasks-body');
  const tasks=activePerson==='All'?allTasks:allTasks.filter(t=>t['Assignee']===activePerson);
  const open=tasks.filter(t=>t['Status']==='Open').length;
  const inprog=tasks.filter(t=>t['Status']==='In Progress').length;
  const done=tasks.filter(t=>t['Status']==='Done').length;

  let html=`<div class="metrics" style="grid-template-columns:repeat(4,1fr);">
    <div class="mc"><div class="mc-label">Open</div><div class="mc-val red">${allTasks.filter(t=>t['Status']==='Open').length}</div><div class="mc-sub">all team</div></div>
    <div class="mc"><div class="mc-label">In progress</div><div class="mc-val amber">${allTasks.filter(t=>t['Status']==='In Progress').length}</div><div class="mc-sub">all team</div></div>
    <div class="mc"><div class="mc-label">Done</div><div class="mc-val green">${allTasks.filter(t=>t['Status']==='Done').length}</div><div class="mc-sub">all team</div></div>
    <div class="mc"><div class="mc-label">Total tasks</div><div class="mc-val">${allTasks.length}</div><div class="mc-sub">all team</div></div>
  </div>`;

  html+=`<div class="person-tabs">`;
  TEAM.forEach(p=>{
    const cnt=allTasks.filter(t=>t['Assignee']===p&&t['Status']!=='Done').length;
    html+=`<button class="ptab ${p===activePerson?'active':''}" onclick="switchPerson('${p}')">${p}${cnt>0?`<span class="${p===activePerson?'cnt-pill':'cnt-pill-inactive'}">${cnt}</span>`:''}</button>`;
  });
  html+=`</div>`;

  html+=`<div class="card"><div class="card-hdr"><div class="card-title">${activePerson === 'General' ? 'General — Company Tasks' : activePerson + ' — Tasks'}</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:12px;color:#999;">${open} open · ${inprog} in progress · ${done} done</span>
      <button class="proj-btn" style="padding:5px 12px;font-size:12px;" onclick="openArchiveView()">📦 View Archive</button>
    </div>
  </div>`;

  const sorted=[...tasks].sort((a,b)=>{
    const p={High:0,Medium:1,Low:2};
    return(p[a['Priority']]??1)-(p[b['Priority']]??1)||String(a['Created']||'').localeCompare(String(b['Created']||''));
  });

  if(!sorted.length){
    html+=`<div class="empty">No tasks for ${activePerson}. Add one below.</div>`;
  } else {
    sorted.forEach(t=>{
      const isDone=t['Status']==='Done';
      const isInProg=t['Status']==='In Progress';
      const due=t['Due Date']?'Due '+fmtDate(t['Due Date']):'';
      const mtid=t['Task ID'].replace(/'/g,"\\'");
      const hasNotes=t['Notes']&&t['Notes'].trim();
      html+=`<div class="task-row">
        <div class="priority-dot p-${(t['Priority']||'Medium').toLowerCase()}"></div>
        <div class="task-check ${isDone?'done':isInProg?'inprog':''}" onclick="event.stopPropagation();cycleStatus('${mtid}')"></div>
        <div class="task-body" style="cursor:pointer;" onclick="openTaskCard('${mtid}')">
          <div class="task-title ${isDone?'done':''}">${t['Title']||'Untitled'}${hasNotes?' 📝':''}</div>
          <div class="task-meta">
            ${due?`<span>${due}</span>`:''}
            ${t['Location']?`<span>${t['Location']}</span>`:''}
            <span class="badge ${isDone?'b-green':isInProg?'b-amber':'b-red'}">${t['Status']}</span>
            <span class="badge b-gray">${t['Priority']||'Medium'}</span>
          </div>
        </div>
        ${isDone?`<span style="font-size:11px;color:#b8934a;cursor:pointer;white-space:nowrap;" onclick="event.stopPropagation();archiveSingleTask('${mtid}')">Archive</span>`:''}
        <button class="task-del" onclick="event.stopPropagation();deleteTask('${mtid}')">×</button>
      </div>`;
    });
  }

  html+=`<div class="add-task-form">
    <input type="text" id="new-task-title" placeholder="Add a task for ${activePerson}..." onkeydown="if(event.key==='Enter')submitTask()">
    <select id="new-task-priority"><option value="High">High</option><option value="Medium" selected>Medium</option><option value="Low">Low</option></select>
    <input type="date" id="new-task-due">
    <select id="new-task-location">
      <option value="">No location</option>
      ${LOCATIONS.map(l=>`<option value="${l.name}">${l.name}</option>`).join('')}
    </select>
    <button class="add-btn" id="add-task-btn" onclick="submitTask()">+ Add task</button>
  </div></div>`;

  body.innerHTML=html;
}

function switchPerson(p){activePerson=p;renderTasks();}

async function submitTask(){
  const title=document.getElementById('new-task-title').value.trim();
  if(!title)return;
  const btn=document.getElementById('add-task-btn');
  btn.disabled=true;btn.textContent='Adding...';
  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'addTask',Title:title,Assignee:activePerson,
        Priority:document.getElementById('new-task-priority').value,
        'Due Date':document.getElementById('new-task-due').value,
        Location:document.getElementById('new-task-location').value,
        Source:'Dashboard',Status:'Open'})});
    const data=await res.json();
    if(data.success){showToast('Task added');await loadTasks();}
    else showToast('Error: '+( data.error||'Unknown'));
  }catch(e){showToast('Could not connect to tasks API');}
  btn.disabled=false;btn.textContent='+ Add task';
}

async function cycleStatus(id){
  const t=allTasks.find(x=>x['Task ID']===id);
  if(!t)return;
  const cycle={Open:'In Progress','In Progress':'Done',Done:'Open'};
  const ns=cycle[t['Status']]||'Open';
  t['Status']=ns;
  if(activeProjectId){
    const proj=allProjects.find(p=>p['Project ID']===activeProjectId);
    if(proj){
      proj['Completed Count']=allTasks.filter(t=>t['Project ID']===activeProjectId&&t['Status']==='Done').length;
      proj['Progress']=proj['Task Count']>0?Math.round((proj['Completed Count']/proj['Task Count'])*100):0;
    }
    renderProjectDetail(activeProjectId);
  } else {
    renderTasks();
  }
  try{
    await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'updateTask','Task ID':id,Status:ns})});
    showToast('Status → '+ns);
  }catch(e){showToast('Error saving status');}
}

async function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  allTasks=allTasks.filter(t=>t['Task ID']!==id);
  if(activeProjectId){
    const proj=allProjects.find(p=>p['Project ID']===activeProjectId);
    if(proj){
      proj['Task Count']=allTasks.filter(t=>t['Project ID']===activeProjectId).length;
      proj['Completed Count']=allTasks.filter(t=>t['Project ID']===activeProjectId&&t['Status']==='Done').length;
      proj['Progress']=proj['Task Count']>0?Math.round((proj['Completed Count']/proj['Task Count'])*100):0;
    }
    renderProjectDetail(activeProjectId);
  } else {
    renderTasks();
  }
  try{
    await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'deleteTask','Task ID':id})});
    showToast('Task deleted');
  }catch(e){showToast('Error deleting task');}
}

async function archiveSingleTask(id){
  const prevTasks=allTasks;
  allTasks=allTasks.filter(t=>t['Task ID']!==id);
  if(activeProjectId){
    const proj=allProjects.find(p=>p['Project ID']===activeProjectId);
    if(proj){
      proj['Task Count']=allTasks.filter(t=>t['Project ID']===activeProjectId).length;
      proj['Completed Count']=allTasks.filter(t=>t['Project ID']===activeProjectId&&t['Status']==='Done').length;
      proj['Progress']=proj['Task Count']>0?Math.round((proj['Completed Count']/proj['Task Count'])*100):0;
    }
    renderProjectDetail(activeProjectId);
  } else {
    renderTasks();
  }
  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'archiveTask','Task ID':id})});
    const data=await res.json();
    if(data.success)showToast('Task archived');
    else{allTasks=prevTasks;if(activeProjectId)renderProjectDetail(activeProjectId);else renderTasks();showToast('Error: '+(data.error||'Unknown'));}
  }catch(e){
    allTasks=prevTasks;
    if(activeProjectId)renderProjectDetail(activeProjectId);else renderTasks();
    showToast('Error archiving task');
  }
}


// ── PROJECTS ──────────────────────────────────────────────
async function loadProjects(){
  document.getElementById('projects-body').innerHTML='<div class="loading"><span class="spinner"></span>Loading projects...</div>';
  try{
    const [pr,tr]=await Promise.all([
      fetch(TASKS_API+'?action=getProjects',{mode:'cors'}).then(r=>r.json()),
      fetch(TASKS_API+'?action=getTasks',{mode:'cors'}).then(r=>r.json())
    ]);
    allProjects=pr.projects||[];
    allTasks=tr.tasks||[];
  }catch(e){allProjects=[];}
  renderProjects();
}

function renderProjects(){
  const body=document.getElementById('projects-body');
  if(activeProjectId)return renderProjectDetail(activeProjectId);

  const statusColor={'Not Started':'b-notstarted','In Progress':'b-inprogress','On Hold':'b-onhold','Complete':'b-complete'};
  const doneTasks=allTasks.filter(t=>t['Status']=='Done').length;

  let html=`<div class="archive-bar">
    <span>${allTasks.filter(t=>t['Status']=='Done').length} completed tasks ready to archive</span>
    <div style="display:flex;gap:8px;">
      <button class="proj-btn" onclick="archiveDoneTasks()">Archive all done tasks</button>
      <button class="proj-btn primary" onclick="toggleNewProjForm()">+ New project</button>
    </div>
  </div>`;

  if(showNewProjForm){
    html+=`<div class="new-proj-form">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:#1a1a1a;">New project</div>
      <input type="text" id="pj-name" placeholder="Project name *">
      <textarea id="pj-desc" placeholder="Description (optional)"></textarea>
      <div class="form-row">
        <select id="pj-status"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="On Hold">On Hold</option><option value="Complete">Complete</option></select>
        <select id="pj-location"><option value="">Company-wide</option>${LOCATIONS.map(l=>`<option value="${l.name}">${l.name}</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <input type="date" id="pj-due" placeholder="Due date">
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="add-btn" style="flex:1;" onclick="submitProject()">Create project</button>
          <button class="proj-btn" onclick="toggleNewProjForm()">Cancel</button>
        </div>
      </div>
    </div>`;
  }

  if(!allProjects.length){
    html+='<div class="empty" style="padding:3rem 0;">No projects yet. Create your first project above.</div>';
  } else {
    const active=allProjects.filter(p=>p['Status']!=='Complete');
    const complete=allProjects.filter(p=>p['Status']=='Complete');
    if(active.length){
      html+='<div style="font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">Active projects</div>';
      html+=active.map(p=>projCard(p,statusColor)).join('');

      html+='<div style="font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;">Completed projects</div>';

  body.innerHTML=html;

function projCard(p,statusColor){
  const pct=parseInt(p['Progress'])||0;
  const loc=p['Location']?`<span class="badge b-blue" style="font-size:10px;">${p['Location']}</span>`:'<span class="badge b-gray" style="font-size:10px;">Company-wide</span>';
  const due=p['Due Date']?` · Due ${fmtDate(p['Due Date'])}`:''
  return`<div class="proj-card" onclick="openProject('${p['Project ID']}')">
    <div class="proj-header">
      <div>
        <div class="proj-name">${p['Name']}</div>
        <div class="proj-meta">${loc}${due}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;" onclick="event.stopPropagation()">
        <span class="badge ${statusColor[p['Status']]||'b-gray'}">${p['Status']}</span>
        <button class="proj-btn danger" onclick="archiveProject('${p['Project ID']}','${p['Name'].replace(/'/g,"\\'")}')">Archive</button>
      </div>
    </div>
    ${p['Description']?`<div style="font-size:12px;color:#888;margin-bottom:8px;">${p['Description']}</div>`:''}
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${pct}% complete · ${p['Completed Count']} of ${p['Task Count']} tasks done</div>
  </div>`;
}

function openProject(id){activeProjectId=id;renderProjects();}
function closeProject(){activeProjectId=null;renderProjects();}

function renderProjectDetail(projectId){
  const body=document.getElementById('projects-body');
  const proj=allProjects.find(p=>p['Project ID']===projectId);
  if(!proj){activeProjectId=null;renderProjects();return;}
  const projTasks=allTasks.filter(t=>t['Project ID']===projectId);

  let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;">

    <span style="color:#ddd;">|</span>

  html+=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <div>
        ${proj['Location']?`<span class="badge b-blue">${proj['Location']}</span>`:'<span class="badge b-gray">Company-wide</span>'}
        ${proj['Due Date']?`<span style="font-size:12px;color:#999;margin-left:8px;">Due ${fmtDate(proj['Due Date'])}</span>`:''}

      <select onchange="updateProjectStatus('${projectId}',this.value)" style="font-size:12px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;">

    </div>
    ${proj['Description']?`<p style="font-size:13px;color:#666;margin-bottom:14px;">${proj['Description']}</p>`:''}
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label" style="margin-bottom:0;">${pct}% complete · ${proj['Completed Count']} of ${proj['Task Count']} tasks done</div>
  </div>`;

  // Task list
  const sorted=[...projTasks].sort((a,b)=>{const p={High:0,Medium:1,Low:2};return(p[a['Priority']]??1)-(p[b['Priority']]??1)||String(a['Created']||'').localeCompare(String(b['Created']||''));});
  html+=`<div class="card"><div class="card-hdr"><div class="card-title">Project tasks</div><span style="font-size:12px;color:#999;">${projTasks.filter(t=>t['Status']==='Open').length} open · ${projTasks.filter(t=>t['Status']=='Done').length} done</span></div>`;

  sorted.forEach(t=>{
    const isDone=t['Status']=='Done',isInProg=t['Status']=='In Progress';
    const tid=t['Task ID'].replace(/'/g,"\\'");
    const hasNotes=t['Notes']&&t['Notes'].trim();

    html+=`<div class="task-row">
      <div class="priority-dot p-${(t['Priority']||'Medium').toLowerCase()}"></div>
      <div class="task-check ${isDone?'done':isInProg?'inprog':''}" onclick="event.stopPropagation();cycleStatus('${tid}')"></div>
      <div class="task-body" style="cursor:pointer;" onclick="openTaskCard('${tid}')">
        <div class="task-title ${isDone?'done':''}">${t['Title']||'Untitled'}${hasNotes?' 📝':''}</div>
        <div class="task-meta">
          <span class="badge b-gray" style="font-size:10px;">${t['Assignee']}</span>
          ${t['Due Date']?`<span>Due ${fmtDate(t['Due Date'])}</span>`:''}
          <span class="badge ${isDone?'b-green':isInProg?'b-amber':'b-red'}">${t['Status']}</span>
          <span class="badge b-gray">${t['Priority']||'Medium'}</span>
        </div>
      </div>
      ${isDone?`<span style="font-size:11px;color:#b8934a;cursor:pointer;white-space:nowrap;" onclick="event.stopPropagation();archiveSingleTask('${tid}')">Archive</span>`:''}
      <button class="task-del" onclick="event.stopPropagation();deleteTask('${tid}')">×</button>
    </div>`;
  });
  html+=`<div class="add-task-form">
    <input type="text" id="pj-task-title" placeholder="Add a task to this project..." onkeydown="if(event.key==='Enter')submitProjectTask()">
    <select id="pj-task-assignee">${TEAM.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
    <select id="pj-task-priority"><option value="High">High</option><option value="Medium" selected>Medium</option><option value="Low">Low</option></select>
    <input type="date" id="pj-task-due">
    <button class="add-btn" onclick="submitProjectTask()">+ Add task</button>
  </div>
  <textarea id="pj-task-notes" rows="2" placeholder="Notes / explanation for this task (optional)..." style="width:100%;margin-top:8px;font-size:12px;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-family:inherit;"></textarea>

async function saveTaskCard(taskId){
  const title=document.getElementById('tc-title').value.trim();
  const assignee=document.getElementById('tc-assignee').value;
  const priority=document.getElementById('tc-priority').value;
  const status=document.getElementById('tc-status').value;
  const dueDate=document.getElementById('tc-due').value;
  const notes=document.getElementById('tc-notes').value;
  if(!title){showToast('Title cannot be empty');return;}

  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'updateTask','Task ID':taskId,
        Title:title,Assignee:assignee,Priority:priority,Status:status,'Due Date':dueDate,Notes:notes})});
    const data=await res.json();
    if(data.success){
      const t=allTasks.find(x=>x['Task ID']===taskId);
      if(t){t['Title']=title;t['Assignee']=assignee;t['Priority']=priority;t['Status']=status;t['Due Date']=dueDate;t['Notes']=notes;}
      closeTaskCard();
      if(activeProjectId)renderProjectDetail(activeProjectId);else renderTasks();
      showToast('Task saved');
    }else showToast('Error: '+(data.error||'Unknown'));
  }catch(e){showToast('Error saving task');}
}

function toggleNewProjForm(){showNewProjForm=!showNewProjForm;renderProjects();}

async function submitProject(){
  const name=document.getElementById('pj-name').value.trim();
  if(!name){showToast('Project name required');return;}
  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'addProject',Name:name,
        Description:document.getElementById('pj-desc').value,
        Status:document.getElementById('pj-status').value,
        Location:document.getElementById('pj-location').value,
        'Due Date':document.getElementById('pj-due').value})});
    const data=await res.json();
    if(data.success){showToast('Project created');showNewProjForm=false;await loadProjects();}
  }catch(e){showToast('Error creating project');}
}

let submittingProjectTask=false;
async function submitProjectTask(){
  if(submittingProjectTask)return;
  const titleEl=document.getElementById('pj-task-title');
  const title=titleEl.value.trim();
  if(!title)return;
  submittingProjectTask=true;
  const btn=document.querySelector('#projects-body .add-btn');
  if(btn){btn.disabled=true;btn.textContent='Adding...';}
  const proj=allProjects.find(p=>p['Project ID']===activeProjectId);
  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'addTask',Title:title,
        Assignee:document.getElementById('pj-task-assignee').value,
        Priority:document.getElementById('pj-task-priority').value,
        'Due Date':document.getElementById('pj-task-due').value,
        Notes:document.getElementById('pj-task-notes').value,
        Location:proj?proj['Location']:'',
        Source:'Project',Status:'Open',
        'Project ID':activeProjectId})});
    const data=await res.json();
    if(data.success){titleEl.value='';document.getElementById('pj-task-notes').value='';showToast('Task added');await loadProjects();}
    else showToast('Error: '+(data.error||'Unknown'));
  }catch(e){showToast('Error adding task');}
  submittingProjectTask=false;
  if(btn){btn.disabled=false;btn.textContent='+ Add task';}
}

async function updateProjectStatus(id,status){
  try{
    await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'updateProject','Project ID':id,Status:status})});
    const proj=allProjects.find(p=>p['Project ID']===id);
    if(proj)proj['Status']=status;
    showToast('Status updated');
    renderProjects();
  }catch(e){showToast('Error updating project');}
}

async function archiveProject(id,name){
  if(!confirm(`Archive project "${name}" and all its tasks?`))return;
  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'archiveProject','Project ID':id})});
    const data=await res.json();
    if(data.success){showToast(`Project archived (${data.tasksArchived} tasks)`);await loadProjects();}
  }catch(e){showToast('Error archiving project');}
}

async function archiveDoneTasks(){
  const count=allTasks.filter(t=>t['Status']=='Done').length;
  if(!count){showToast('No done tasks to archive');return;}
  if(!confirm(`Archive all ${count} completed tasks across the whole team?`))return;
  try{
    const res=await fetch(TASKS_API,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'archiveDoneTasks'})});
    const data=await res.json();
    if(data.success){showToast(`${data.archived} tasks archived`);await loadTasks();if(activeMain==='projects')await loadProjects();}
  }catch(e){showToast('Error archiving tasks');}
}


// ── DETAIL MODALS ─────────────────────────────────────────
function openModal(title, html){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('detail-modal').classList.add('open');
}
function closeModal(){
  document.getElementById('detail-modal').classList.remove('open');
}

function modalTable(headers, rows){
  if(!rows.length) return '<div class="empty">No items to display.</div>';
  return `<div class="tbl-wrap"><table>
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('')}</tbody>
  </table></div>`;
}

function getDetailData(){
  // Use current active location filter
  if(activeLoc==='All Locations'){
    let c=[];
    LOCATIONS.forEach(l=>{if(allData[l.name])allData[l.name].forEach(r=>c.push({...r,_location:l.name}));});
    return c;
  }
  return(allData[activeLoc]||[]).map(r=>({...r,_location:activeLoc}));
}

function showVacantDetail(){
  const data=getDetailData();
  const vacant=data.filter(r=>(r['Status']||'').toLowerCase()==='vacant');
  const rows=vacant.map(r=>`<tr>
    <td>${locBadge(r._location)}</td>
    <td>${r['Unit']||'—'}</td>
    <td>${r['Size']||'—'}</td>
    <td>${r['Asking Price']||'—'}</td>
  </tr>`);
  openModal(`Vacant Units (${vacant.length})`, modalTable(['Location','Unit','Size','Asking Price'], rows));
}

function showNoticeDetail(){
  const data=getDetailData();
  const notice=data.filter(r=>(r['Status']||'').toLowerCase().includes('notice'));
  const sorted=[...notice].sort((a,b)=>new Date(a['Move out Date']||'9999')-new Date(b['Move out Date']||'9999'));
  const rows=sorted.map(r=>`<tr>
    <td>${locBadge(r._location)}</td>
    <td>${r['Unit']||'—'}</td>

const AC_PROXY_URL = 'https://script.google.com/macros/s/AKfycbzOiQ8_BWY6RpAQDpJE7lgJQfvbKc4Z1xlYbpKDp9QE_m0-NKbwZGQDbYHTbbXLgJoo/exec';
const AC_WRITE_PROXY_URL = AC_PROXY_URL;
let showAddContactForm=false, addContactSaving=false, addContactError='';
const CONTACT_LOCATIONS=['Blue Heron Bay','South Lake Conroe','Magnolia','Walden','Office Park'];

async function acProxy(params){
  const qs = Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const res = await fetch(AC_PROXY_URL+'?'+qs, {mode:'cors'});
  if(!res.ok) throw new Error('Proxy error: '+res.status);
  return res.json();
}

async function loadContacts(){
  const body = document.getElementById('contacts-body');
  body.innerHTML='<div class="loading"><span class="spinner"></span>Loading contacts from ActiveCampaign...</div>';
  try{
    // Fetch tags and lists first
    const [tagsData, listsData] = await Promise.all([
      acProxy({action:'getTags'}),
      acProxy({action:'getLists'}),
    ]);
    allContactTags  = tagsData.tags   || [];
    allContactLists = listsData.lists || [];

    // Fetch contacts in batches of 100 (proxy handles tags+lists per contact)
    let contacts = [];
    let offset   = 0;
    let total    = 999999; // don't trust total for loop control — rely on batch size instead
    while(offset < 2000){
      const page = await acProxy({action:'getContacts', limit:100, offset});
      total    = parseInt(page.total||0) || total;
      const batch = page.contacts||[];
      if(!batch.length) break;
      // Map _tagIds/_listIds from proxy
      batch.forEach(c=>{
        c._tags  = (c._tagIds  ||[]).map(t=>String(t));
        c._lists = (c._listIds ||[]).map(l=>String(l));
      });
      contacts = contacts.concat(batch);
      offset  += 100;
      if(batch.length < 100) break;
    }

    allContacts = contacts;
    acContactsLoaded = true;
    renderContacts();
  }catch(err){
    body.innerHTML='<div class="err-msg">Could not load contacts. Error: '+err.message+'<br><br><button class="refresh-btn" onclick="loadContacts()">Try again</button></div>';
    console.error(err);
  }
}

function getTagName(tagId){
  const t=allContactTags.find(x=>String(x.id)===String(tagId));
  return t?t.tag:('Tag '+tagId);
}
function getListName(listId){
  const l=allContactLists.find(x=>String(x.id)===String(listId));
  return l?l.name:('List '+listId);
}

function renderContacts(){
  const body=document.getElementById('contacts-body');
  let filtered=[...allContacts];
  if(contactSearch){
    const q=contactSearch.toLowerCase();
    filtered=filtered.filter(c=>((c.firstName||'')+' '+(c.lastName||'')+' '+(c.email||'')).toLowerCase().includes(q));
  }
  if(activeTagFilter) filtered=filtered.filter(c=>c._tags.includes(activeTagFilter));
  if(activeListFilter) filtered=filtered.filter(c=>c._lists.includes(activeListFilter));
  filtered.sort((a,b)=>(a.lastName||'').localeCompare(b.lastName||''));

  const usedTags =[...new Set(allContacts.flatMap(c=>c._tags))];
  const usedLists=[...new Set(allContacts.flatMap(c=>c._lists))];

  let html=`<div class="contacts-toolbar">
    <input type="text" placeholder="Search by name or email..." value="${contactSearch.replace(/"/g,'&quot;')}"
      oninput="contactSearch=this.value;renderContacts()">
    <button class="refresh-btn" onclick="loadContacts()">&#8635; Refresh</button>
    <button class="refresh-btn" style="background:#1D9E75;color:#fff;border-color:#1D9E75;" onclick="openAddContactForm()">+ Add Contact</button>
  </div>`;

  if(usedLists.length){
    html+=`<div style="font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Lists</div>
    <div class="filter-pills">
      <span class="filter-pill ${!activeListFilter?'active':''}" onclick="activeListFilter='';renderContacts()">All lists</span>
      ${usedLists.map(lid=>`<span class="filter-pill ${activeListFilter===lid?'active':''}" onclick="activeListFilter='${lid}';renderContacts()">${getListName(lid)}</span>`).join('')}
    </div>`;
  }
  if(usedTags.length){
    html+=`<div style="font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Tags</div>
    <div class="filter-pills">
      <span class="filter-pill ${!activeTagFilter?'active':''}" onclick="activeTagFilter='';renderContacts()">All tags</span>
      ${usedTags.map(tid=>`<span class="filter-pill ${activeTagFilter===tid?'active':''}" onclick="activeTagFilter='${tid}';renderContacts()">${getTagName(tid)}</span>`).join('')}
    </div>`;
  }

  html+=`<div class="contacts-count">Showing ${filtered.length} of ${allContacts.length} contacts</div>`;

  if(!filtered.length){
    html+='<div class="empty" style="padding:2rem 0;">No contacts match your search or filters.</div>';
  } else {
    filtered.forEach(c=>{
      const name=((c.firstName||'')+' '+(c.lastName||'')).trim()||c.email||'Unknown';
      const initials=name.split(' ').map(n=>n[0]||'').join('').toUpperCase().slice(0,2)||'?';
      const tags =c._tags.map(t=>`<span class="tag-badge">${getTagName(t)}</span>`).join('');
      const lists=c._lists.map(l=>`<span class="list-badge">${getListName(l)}</span>`).join('');
      const phone=c.phone?`<span style="font-size:11px;color:#999;">${c.phone}</span>`:'';
      html+=`<div class="contact-card">
        <div class="contact-avatar">${initials}</div>
        <div class="contact-info">
          <div class="contact-name">${name}</div>
          <div class="contact-email">${c.email||'—'} ${phone}</div>
          <div class="contact-meta">${lists}${tags}${c.score&&c.score!=='0'?`<span class="contact-score">Score: ${c.score}</span>`:''}</div>
        </div>
      </div>`;
    });
  }
  body.innerHTML=html;
  renderAddContactModal();
}

function openAddContactForm(){
  showAddContactForm=true;
  addContactError='';
  renderAddContactModal();
}
function closeAddContactForm(){
  showAddContactForm=false;
  renderAddContactModal();
}

  const tagOptions = allContactTags.map(t=>`<option value="${t.tag||t.name}">${t.tag||t.name}</option>`).join('');
  const listOptions = allContactLists.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');

  el.innerHTML=`
  <div style="position:fixed;inset:0;background:rgba(16,36,28,0.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;" onclick="if(event.target===this)closeAddContactForm()">
    <div style="background:#fff;border-radius:8px;padding:28px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      <h3 style="margin:0 0 18px;color:#1D9E75;">Add Contact</h3>

      ${addContactError?`<div style="background:#fbeceb;color:#8a2e28;padding:10px 12px;border-radius:4px;font-size:12px;margin-bottom:14px;">${addContactError}</div>`:''}

      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><label style="display:block;font-size:11px;color:#888;font-weight:600;margin-bottom:4px;">First Name</label>
          <input id="ac-first" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin-bottom:12px;"></div>
        <div style="flex:1;"><label style="display:block;font-size:11px;color:#888;font-weight:600;margin-bottom:4px;">Last Name</label>
          <input id="ac-last" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin-bottom:12px;"></div>
      </div>

      <label style="display:block;font-size:11px;color:#888;font-weight:600;margin-bottom:4px;">Email *</label>
      <input id="ac-email" type="email" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin-bottom:12px;">

      <label style="display:block;font-size:11px;color:#888;font-weight:600;margin-bottom:4px;">Phone</label>

      <label style="display:block;font-size:11px;color:#888;font-weight:600;margin-bottom:4px;">Location</label>

        <option value="">— None —</option>
        ${listOptions}
      </select>

      <label style="display:block;font-size:11px;color:#888;font-weight:600;margin-bottom:4px;">Tags (comma-separated)</label>
      <input id="ac-tags" placeholder="e.g. prospect, Day Office" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin-bottom:6px;">
      <div style="font-size:10px;color:#aaa;margin-bottom:12px;">Existing tags include: ${allContactTags.slice(0,10).map(t=>t.tag||t.name).join(', ')}${allContactTags.length>10?'...':''}</div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
        <button onclick="closeAddContactForm()" ${addContactSaving?'disabled':''} style="padding:9px 16px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;">Cancel</button>
        <button onclick="submitAddContact()" ${addContactSaving?'disabled':''} style="padding:9px 20px;border:none;border-radius:4px;background:#1D9E75;color:#fff;font-weight:600;cursor:pointer;opacity:${addContactSaving?'0.6':'1'};">${addContactSaving?'Saving…':'Save Contact'}</button>
      </div>
    </div>
  </div>`;
}

async function submitAddContact(){
  const firstName = document.getElementById('ac-first').value.trim();
  const lastName  = document.getElementById('ac-last').value.trim();
  const email     = document.getElementById('ac-email').value.trim();
  const phone     = document.getElementById('ac-phone').value.trim();
  const location  = document.getElementById('ac-location').value;
  const listId    = document.getElementById('ac-list').value;
  const tagsRaw   = document.getElementById('ac-tags').value.trim();
  const tags      = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];

  if(!email){
    addContactError='Email is required.';
    renderAddContactModal();
    return;
  }

  addContactSaving=true;
  addContactError='';
  renderAddContactModal();

  try{
    const res = await fetch(AC_WRITE_PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({ action:'createContact', firstName, lastName, email, phone, location, listId, tags })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    addContactSaving=false;
    showAddContactForm=false;
    renderAddContactModal();
    await loadContacts(); // refresh list to show the new contact
  }catch(err){
    addContactSaving=false;
    addContactError='Could not save: '+err.message;
    renderAddContactModal();
  }
}

const VO_LOCATIONS = [
  {
    name: 'Magnolia',
    url:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vSu-2PP6FgUeP5n_NcGEQW7mDdVWaa3KssgDx5WFSH9-YVmEm80IHx5nShmeqPeUNClnMy5QPgloSIB/pub?gid=0&single=true&output=csv'
  },
  {
    name: 'Walden',
    url:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vSu-2PP6FgUeP5n_NcGEQW7mDdVWaa3KssgDx5WFSH9-YVmEm80IHx5nShmeqPeUNClnMy5QPgloSIB/pub?gid=1730609901&single=true&output=csv'
  },
];

async function loadVO(){
  document.getElementById('vo-body').innerHTML='<div class="loading"><span class="spinner"></span>Loading virtual office data...</div>';
  const RAILWAY_CSV_PROXY='https://magnolia-platform-backend1-production.up.railway.app/api/csv-proxy?url=';
  await Promise.all(VO_LOCATIONS.map(async loc=>{
    try{
      const res=await fetch(RAILWAY_CSV_PROXY+encodeURIComponent(loc.url));
      if(!res.ok)throw new Error('proxy failed');
      const text=await res.text();
      voData[loc.name]=parseCSV(text).filter(r=>r['Unit']&&(r['Company Name']||r['Contact Person']));
    }catch(e){
      try{
        const r2=await fetch(loc.url,{mode:'cors'});
        const t2=await r2.text();
        voData[loc.name]=parseCSV(t2).filter(r=>r['Unit']&&(r['Company Name']||r['Contact Person']));
      }catch(e2){voData[loc.name]=[];}
    }
  }));
  renderVO();
}

function svcBadge(svc){
  if(!svc)return'<span class="svc-badge-other">—</span>';
  const s=svc.toLowerCase();
  if(s.includes('address'))return`<span class="svc-badge-addr">Address Only</span>`;
  if(s.includes('private'))return`<span class="svc-badge-pmb">Private Mailbox</span>`;
  if(s==='mail')return`<span class="svc-badge-mail">Mail</span>`;
  return`<span class="svc-badge-other">${svc}</span>`;
}

function renderVO(){
  const body=document.getElementById('vo-body');
  const data=voData[activeVOLocation]||[];

  // Filter
  let filtered=[...data];
  if(voSearch){
    const q=voSearch.toLowerCase();
    filtered=filtered.filter(r=>(r['Unit']||'').toLowerCase().includes(q)||
      (r['Company Name']||'').toLowerCase().includes(q)||
      (r['Contact Person']||'').toLowerCase().includes(q));
  }
  if(voServiceFilter) filtered=filtered.filter(r=>(r['Level of Service']||'').toLowerCase().includes(voServiceFilter.toLowerCase()));

  // Metrics
  const all=voData[activeVOLocation]||[];
  const addrOnly=all.filter(r=>(r['Level of Service']||'').toLowerCase().includes('address')).length;
  const pmb=all.filter(r=>(r['Level of Service']||'').toLowerCase().includes('private')).length;
  const mailOnly=all.filter(r=>(r['Level of Service']||'').toLowerCase()==='mail').length;
  const vacant=all.filter(r=>!r['Company Name']&&!r['Contact Person']).length;

  let html=`<div class="vo-tabs">
    ${VO_LOCATIONS.map(l=>`<button class="vtab ${l.name===activeVOLocation?'active':''}" onclick="activeVOLocation='${l.name}';voSearch='';voServiceFilter='';renderVO()">${l.name}</button>`).join('')}
  </div>`;

  html+=`<div class="metrics">
    <div class="mc"><div class="mc-label">Total units</div><div class="mc-val">${all.length}</div><div class="mc-sub">${activeVOLocation}</div></div>
    <div class="mc"><div class="mc-label">Active customers</div><div class="mc-val green">${all.length-vacant}</div><div class="mc-sub">occupied</div></div>
    <div class="mc"><div class="mc-label">Vacant units</div><div class="mc-val red">${vacant}</div><div class="mc-sub">available</div></div>
    <div class="mc"><div class="mc-label">Address only</div><div class="mc-val blue">${addrOnly}</div><div class="mc-sub">plan type</div></div>
    <div class="mc"><div class="mc-label">Private mailbox</div><div class="mc-val" style="color:#3C3489;">${pmb}</div><div class="mc-sub">plan type</div></div>
    ${mailOnly?`<div class="mc"><div class="mc-label">Mail only</div><div class="mc-val amber">${mailOnly}</div><div class="mc-sub">plan type</div></div>`:''}
  </div>`;

  html+=`<div class="vo-search">
    <input type="text" placeholder="Search by unit, company, or contact..." value="${voSearch.replace(/"/g,'&quot;')}"
      oninput="voSearch=this.value;renderVO()">
    <select onchange="voServiceFilter=this.value;renderVO()">
      <option value="">All service types</option>
      <option value="address" ${voServiceFilter==='address'?'selected':''}>Address Only</option>
      <option value="private" ${voServiceFilter==='private'?'selected':''}>Private Mailbox</option>
      <option value="mail" ${voServiceFilter==='mail'?'selected':''}>Mail</option>
    </select>
    <button class="refresh-btn" onclick="loadVO()">&#8635; Refresh</button>
  </div>`;

  html+=`<div class="vo-count">Showing ${filtered.length} of ${all.length} customers</div>`;

  html+=`<div class="card"><div class="vo-table-wrap"><table>
    <thead><tr>
      <th>Unit</th>
      <th>Company Name</th>
      <th>Contact Person</th>
      <th>Service</th>
      <th>Inside Mailbox</th>
      <th>Outside Mailbox</th>
    </tr></thead>
    <tbody>`;

  if(!filtered.length){
    html+=`<tr><td colspan="6" style="text-align:center;color:#bbb;padding:2rem;">No customers match your search.</td></tr>`;
  } else {
    filtered.forEach(r=>{
      const isEmpty=!r['Company Name']&&!r['Contact Person'];
      html+=`<tr ${isEmpty?'style="opacity:.4;"':''}>
        <td><strong>${r['Unit']||'—'}</strong></td>
        <td>${r['Company Name']||'<span style="color:#bbb;">Vacant</span>'}</td>
        <td>${r['Contact Person']||'—'}</td>
        <td>${svcBadge(r['Level of Service'])}</td>
        <td>${r['Inside Mailbox #']||'—'}</td>
        <td>${r['Outside Mailbox #']||'—'}</td>
      </tr>`;
    });
  }

  html+=`</tbody></table></div></div>`;
  body.innerHTML=html;
}
